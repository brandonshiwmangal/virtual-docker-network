version 1.1
service nagle
service tcp-keepalives-in
service tcp-keepalives-out
service timestamps debug datetime msec localtime show-timezone
service timestamps log datetime msec localtime show-timezone
service password-encryption
service call-home
platform qfp utilization monitor load 80
no platform punt-keepalive disable-kernel-core
platform qos match-statistics per-filter
platform qos match-statistics per-ace
platform console virtual
platform hardware throughput level MB T4
!
hostname SnakeT2R
!
boot-start-marker
boot system bootflash:packages.conf
boot-end-marker
!
!
vrf definition MNT-intf
 description MNT-T2R
 !
 address-family ipv4
 exit-address-family
 !
 address-family ipv6
 exit-address-family
!
logging userinfo
logging buffered 51200 informational
aaa new-model
!
!
aaa group server radius LOCAL_RADIUS
 ip radius source-interface Loopback0
!
aaa group server radius REMOTE_RADIUS
 ip radius source-interface Loopback0
!
aaa authentication login default group LOCAL_RADIUS group REMOTE_RADIUS local
aaa authentication login AUTHC_PROV local
aaa authentication login AAA_CONSOLE local line
aaa authorization exec default group LOCAL_RADIUS group REMOTE_RADIUS local if-authenticated 
aaa authorization exec AUTHZ_PROV local 
!
!
aaa session-id common
clock timezone GMT 6 0
vtp version 1
ip arp gratuitous none
no ip icmp rate-limit unreachable
!
ip multicast-routing distributed
!
!
!
no ip domain lookup
no ip dhcp use vrf connected
!
!
!
ip igmp limit 500
login block-for 600 attempts 3 within 120
login on-failure log
login on-success log
!
!
!
subscriber templating
! 
!
!
flow record FLOW_RECORD
 match ipv4 tos
 match ipv4 protocol
 match ipv4 source address
 match ipv4 destination address
 match transport source-port
 match transport destination-port
 collect interface input
 collect counter bytes long
 collect counter packets long
!
!
flow monitor FLOW_MONITOR
 description CAPACITY PLANNING FOR WAN LINK
 exporter FLOW_EXPORT_E
 exporter FLOW_EXPORT_S_LOGSTASH
 cache timeout inactive 60
 cache timeout active 3600
 cache entries 16384
 record FLOW_RECORD
!
sampler FLOW_SAMPLER
 mode deterministic 1 out-of 100
!
!
multilink bundle-name authenticated
!
!
!
!
!
object-group network NET_LOOPBACK0 
 description CPP Exit-Map for Loopback UDP and TCP Traffic
 host 192.168.1.124
!
object-group service SVC_LOCAL_MGT_TCP_TRAFFIC 
 tcp eq ftp
 tcp source eq ftp
 tcp range 1645 1646
 tcp source range 1645 1646
 tcp range 1812 1813
 tcp source range 1812 1813
 tcp eq bgp
 tcp source eq bgp
 tcp eq 639
 tcp source eq 639
!
object-group service SVC_LOCAL_MGT_UDP_TRAFFIC 
 description QoS Local MGT ports
 udp eq tftp
 udp source eq tftp
 udp eq snmptrap
 udp source eq snmptrap
 udp eq syslog
 udp source eq syslog
 udp range 1645 1646
 udp source range 1645 1646
 udp range 1812 1813
 udp source range 1812 1813
!
!
spanning-tree extend system-id
!
!
!
redundancy
!
!
!
class-map match-any CMAP_ALLOWED_ICMP_UNREACHABLES
  description UNREACHABLES SENT BY THIS ROUTER
 match access-group name ACL_ALLOWED_ICMPV4_UNREACHABLES
 match access-group name ACL_ALLOWED_ICMPV6_UNREACHABLES
class-map match-any CMAP_ICMP_PING
  description IPV4/V6 ICMP PING PACKETS
 match access-group name ACL_ICMPV4_PING
 match access-group name ACL_ICMPV6_PING
class-map match-any CMAP_IP_SPECIAL
  description IPV4 OPTIONS AND IPV6 EXTENSION HEADERS
 match access-group name ACL_IPV4_OPTIONS
 match access-group name ACL_IPV6_COMMON_EH
class-map match-any CMAP_ND
  description IPV4/V6 NEIGHBOR DISCOVERY PROTOCOLS
 match protocol arp
 match access-group name ACL_IPV6_ND
class-map match-any CMAP_DENIED_ICMP_UNREACHABLES
  description UNREACHABLES NEVER SENT BY THIS ROUTER
 match access-group name ACL_DENIED_ICMPV4_UNREACHABLES
 match access-group name ACL_DENIED_ICMPV6_UNREACHABLES
class-map match-any CMAP_IP_FRAGMENTS
  description IPV4/V6 FRAGMENTED PACKETS
 match access-group name ACL_IPV4_FRAGMENTS
 match access-group name ACL_IPV6_FRAGMENTS
class-map match-all CMAP_NP
 match access-group name ACL_LOOPBACK0
!
policy-map PMAP_CPP_IN
 class CMAP_NP
 class CMAP_ND
  police rate 50 pps
   conform-action transmit 
   exceed-action drop 
 class CMAP_ICMP_PING
  police rate 500 pps
   conform-action transmit 
   exceed-action drop 
 class CMAP_IP_SPECIAL
  police rate 100 pps
   conform-action transmit 
   exceed-action drop 
 class CMAP_IP_FRAGMENTS
  police rate 20 pps
   conform-action transmit 
   exceed-action drop 
policy-map PMAP_CPP_OUT
 class CMAP_ALLOWED_ICMP_UNREACHABLES
  police rate 20 pps
   conform-action transmit 
   exceed-action drop 
 class CMAP_DENIED_ICMP_UNREACHABLES
  police rate 1 pps conform-action drop 
!
! 
!
!
!
!
!
!
!
!
!
!
!
!
!
! 
! 
!
!
interface Loopback0
 ip address 192.168.1.124 255.255.255.255
 no ip redirects
 no ip unreachables
 no ip proxy-arp
 ip pim sparse-mode
 ip ospf 21 area 0
!
interface Loopback239
 description ANYCAST RP FOR LOCAL MULTICAST
 ip address 192.168.255.255 255.255.255.255
 no ip redirects
 no ip unreachables
 no ip proxy-arp
 ip pim sparse-dense-mode
!

!
interface GigabitEthernet1
 description to MNT(Provisioning)
 vrf forwarding MNT-intf
 ip address 192.168.127.254 255.255.255.0
 no ip redirects
 no ip unreachables
 no ip proxy-arp
 negotiation auto
 no mop enabled
 no mop sysid
!
interface GigabitEthernet2
 description To T2R-LAN PortGroup (FWH) 
 no ip address
 no ip redirects
 no ip unreachables
 no ip proxy-arp
 negotiation auto
 no mop enabled
 no mop sysid
!
interface GigabitEthernet2.224
 description Interface to FWH
 encapsulation dot1Q 224
 ip address 192.168.1.113 255.255.255.248
 no ip redirects
 no ip unreachables
 no ip proxy-arp
 ip pim sparse-mode
 ip ospf authentication message-digest
 ip ospf network broadcast
 ip ospf 21 area 0
!
interface GigabitEthernet3
 description To T2R-WAN PortGroup
 no ip address
 no ip redirects
 no ip unreachables
 no ip proxy-arp
 negotiation auto
 no mop enabled
 no mop sysid
!
interface GigabitEthernet3.7
 description UnTrusted PnP Connection
 encapsulation dot1Q 7
 ip address 192.168.0.1 255.255.0.0
 no ip proxy-arp
 ip pim sparse-mode
 ip multicast boundary ACL_DENY_LOCAL_MCG
 ip ospf authentication message-digest
 ip ospf 21 area 0
 ip ospf cost 10
!
router ospf 21
 router-id 192.168.1.124
 passive-interface default
 no passive-interface GigabitEthernet2.224
!
ip local policy route-map LOCAL_MANAGEMENT_TRAFFIC
ip forward-protocol nd
ip pim rp-address 10.255.255.255 ACL_LOCAL_MCG override
ip pim spt-threshold infinity
ip pim bsr-candidate Loopback0 4 1
ip pim rp-candidate Loopback0 group-list ACL_CANDIDATE_RP_MCG priority 255
ip pim rp-candidate Loopback239 group-list ACL_LOCAL_MCG priority 1
ip pim register-rate-limit 512000
ip pim register-source Loopback0
ip tcp synwait-time 10
no ip http server
no ip http secure-server
!
ip tftp source-interface Loopback0
ip ssh time-out 60
ip ssh authentication-retries 2
ip ssh port 3022 rotary 1
ip ssh source-interface Loopback0
ip ssh version 2
ip ssh dscp 40
!
ip access-list standard ACL_LOCAL_MCG
 10 remark LOCAL MCAST DENSE GROUPS
 10 permit 239.0.11.0 0.0.0.255
 20 permit 239.0.12.0 0.0.0.255
 30 permit 239.192.0.0 0.0.1.255
 40 remark TGS LOCAL MCAST GROUPS
 40 permit 239.192.252.0 0.0.1.255
 50 remark WAVE LOCAL MCAST GROUPS
 50 permit 239.192.248.0 0.0.0.63
 60 deny   any
ip access-list extended ACL_ALLOWED_ICMPV4_UNREACHABLES
 10 remark PERMIT TRACEROUTE REPLIES AND PMTUD
 10 permit icmp any any time-exceeded
 20 permit icmp any any port-unreachable
 30 permit icmp any any packet-too-big
ip access-list extended ACL_DENIED_ICMPV4_UNREACHABLES
 10 permit icmp any any unreachable
ip access-list extended ACL_DENY_LOCAL_MCG
 10 remark DENY LOCAL MCAST DENSE GROUPS
 10 deny ip 192.168.129.0 0.0.0.255 any
 20 deny ip any 239.0.11.0 0.0.0.255 log
 30 deny ip any 239.0.12.0 0.0.0.255 log
 40 deny ip any 239.192.0.0 0.0.1.255 log
 50 remark TGS LOCAL MCAST GROUPS
 50 deny ip any 239.192.252.0 0.0.1.255 log
 60 remark WAVE LOCAL MCAST GROUPS
 60 deny ip any 239.192.248.0 0.0.0.63 log
 70 deny ip any 239.255.0.0 0.0.255.255 log
 80 permit ip any any
ip access-list extended ACL_ICMPV4_PING
 10 permit icmp any any echo
ip access-list extended ACL_IPV4_FRAGMENTS
 10 permit ip any any fragments
ip access-list extended ACL_IPV4_OPTIONS
 10 permit ip any any option any-options
ip access-list extended ACL_LOCAL_MGT_TCP_TRAFFIC
 10 remark QoS Local MGT ports
 10 permit object-group SVC_LOCAL_MGT_TCP_TRAFFIC any any
ip access-list extended ACL_LOCAL_MGT_UDP_TRAFFIC
 10 remark QoS Local MGT ports
 10 permit object-group SVC_LOCAL_MGT_UDP_TRAFFIC any any
ip access-list extended ACL_LOOPBACK0
 10 permit object-group SVC_LOCAL_MGT_TCP_TRAFFIC object-group NET_LOOPBACK0 any
 20 permit object-group SVC_LOCAL_MGT_UDP_TRAFFIC object-group NET_LOOPBACK0 any
!
logging history informational
logging source-interface Loopback0
logging snmp-trap emergencies
logging snmp-trap alerts
logging snmp-trap critical
logging snmp-trap errors
logging snmp-trap warnings
logging snmp-trap notifications
logging snmp-trap informational
ip access-list extended 199
 10 deny ip any any log-input
 remark URPF LOGGING ACL
!
route-map LOCAL_MANAGEMENT_TRAFFIC permit 5 
 match ip address ACL_LOCAL_MGT_UDP_TRAFFIC
 set ip precedence immediate
 set default interface Loopback0
!
route-map LOCAL_MANAGEMENT_TRAFFIC permit 10 
 match ip address ACL_LOCAL_MGT_TCP_TRAFFIC
 set ip precedence critical
 set default interface Loopback0
!
snmp-server source-interface informs Loopback0
snmp-server ip dscp 16
snmp-server enable traps flash insertion removal lowspace
snmp-server enable traps cpu threshold
snmp-server enable traps ike policy add
snmp-server enable traps ike policy delete
snmp-server enable traps ike tunnel start
snmp-server enable traps ike tunnel stop
snmp-server enable traps ipsec tunnel start
snmp-server enable traps ipsec tunnel stop
snmp-server enable traps ipsec too-many-sas
snmp-server enable traps alarms major
!
!
!
!
!
ipv6 access-list ACL_ALLOWED_ICMPV6_UNREACHABLES
 sequence 10 remark PERMIT TRACEROUTE REPLIES AND PMTUD
 sequence 20 permit icmp any any time-exceeded
 sequence 30 permit icmp any any port-unreachable
 sequence 40 permit icmp any any packet-too-big
!
ipv6 access-list ACL_DENIED_ICMPV6_UNREACHABLES
 sequence 10 permit icmp any any unreachable
!
ipv6 access-list ACL_ICMPV6_PING
 sequence 10 permit icmp any any echo-request
!
ipv6 access-list ACL_IPV6_COMMON_EH
 sequence 10 permit ipv6 any any auth
 sequence 20 permit ipv6 any any dest-option
 sequence 30 permit ipv6 any any hbh
 sequence 40 permit ipv6 any any mobility
 sequence 50 permit ipv6 any any routing
!
ipv6 access-list ACL_IPV6_FRAGMENTS
 sequence 10 permit ipv6 any any fragments
!
ipv6 access-list ACL_IPV6_ND
 sequence 10 permit icmp any any nd-na
 sequence 20 permit icmp any any nd-ns
 sequence 30 permit icmp any any router-solicitation
 sequence 40 permit icmp any any router-advertisement
!
control-plane
 service-policy input PMAP_CPP_IN
 service-policy output PMAP_CPP_OUT
!
!
mgcp behavior rsip-range tgcp-only
mgcp behavior comedia-role none
mgcp behavior comedia-check-media-src disable
mgcp behavior comedia-sdp-force disable
!
mgcp profile default
!
!
!
!
!
banner exec ^C
banner motd ^C
alias exec flow show flow monitor FLOW_MONITOR cache format table
!
line con 0
 session-timeout 600 
 logging synchronous
 login authentication AAA_CONSOLE
 stopbits 1
line aux 0
line vty 0 4
 session-timeout 600 
 access-class IA_ACL_ALLOWED_VTY_IN in vrf-also
 logging synchronous
 transport input ssh
 transport output ssh
line vty 5 13
 session-timeout 600 
 access-class IA_ACL_ALLOWED_VTY_IN in vrf-also
 logging synchronous
 transport input ssh
 transport output ssh
line vty 14 15
 session-timeout 600 
 access-class IA_ACL_PROVISIONING_SSH in vrf-also
 authorization exec AUTHZ_PROV
 logging synchronous
 login authentication AUTHC_PROV
 rotary 1
 length 0
 transport input ssh
 transport output ssh
!
!
!
!
!
!
!
end
