default-lease-time 600;
max-lease-time 7200;
authoritative;
log-facility local7;

# ── VLAN 10  /  LAN ──────────────────────────────────────────
subnet 10.10.10.0 netmask 255.255.255.0 {
    range 10.10.10.100 10.10.10.200;
    option routers 10.10.10.1;
    option subnet-mask 255.255.255.0;
    option domain-name-servers 8.8.8.8, 1.1.1.1;
    option domain-name "vdn.local";
    default-lease-time 600;
    max-lease-time 7200;
}

# ── VLAN 20  /  DMZ ──────────────────────────────────────────
subnet 10.10.20.0 netmask 255.255.255.0 {
    range 10.10.20.100 10.10.20.200;
    option routers 10.10.20.1;
    option subnet-mask 255.255.255.0;
    option domain-name-servers 8.8.8.8, 1.1.1.1;
    option domain-name "dmz.vdn.local";
    default-lease-time 600;
    max-lease-time 7200;
}

# Declare non-DHCP subnets so ISC does not complain
subnet 172.20.0.0 netmask 255.255.255.0 {}
subnet 10.10.30.0 netmask 255.255.255.0 {}
subnet 10.10.40.0 netmask 255.255.255.0 {}
