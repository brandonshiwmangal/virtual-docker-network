! fw01 - FRR 9.0 config, corrected to peer with SnakeT2R (Cisco, OSPFv2)
! Lines marked  ! FIX:  were added or changed.
! <<OSPF_KEY>> must match the router's Gi2.224 message-digest-key 1.
frr version 9.0
frr defaults traditional
hostname fw01
log syslog informational
service integrated-vtysh-config
!
! FIX: RP group ranges copied from the router's ACL_LOCAL_MCG
ip prefix-list LOCAL_MCG seq 10 permit 239.0.11.0/24
ip prefix-list LOCAL_MCG seq 20 permit 239.0.12.0/24
ip prefix-list LOCAL_MCG seq 30 permit 239.192.0.0/23
ip prefix-list LOCAL_MCG seq 40 permit 239.192.252.0/23
ip prefix-list LOCAL_MCG seq 50 permit 239.192.248.0/26
!
! FIX: static anycast RP, same as the router (other groups come from BSR)
ip pim rp 192.168.255.255 prefix-list LOCAL_MCG
!
interface lo
 ip address 2.2.2.2/32
 ipv6 address fd00:ffff::2/128
 ! FIX: advertise the loopback into OSPFv2 as well
 ip ospf area 0
!
interface ospf0
 ipv6 address fd00:1::1/64
 ipv6 ospf6 area 0.0.0.0
 ipv6 ospf6 hello-interval 10
 ipv6 ospf6 dead-interval 40
!
! FIX: new link to SnakeT2R Gi2.224 (router is 192.168.1.113/29)
interface eth1.224
 description to SnakeT2R Gi2.224
 ip address 192.168.1.114/29
 ip ospf area 0
 ip ospf network broadcast
 ip ospf hello-interval 10
 ip ospf dead-interval 40
 ip ospf authentication message-digest
 ip ospf message-digest-key 1 md5 <<OSPF_KEY>>
 ip pim
 ip igmp
!
router ospf6
 ospf6 router-id 2.2.2.2
 redistribute connected
!
! FIX: the router only speaks OSPFv2 (IPv4); fw01 only ran OSPFv3 (IPv6)
router ospf
 ospf router-id 2.2.2.2
 passive-interface default
 no passive-interface eth1.224
 ! advertises the 10.10.x.x / 172.20.0.0 LANs to the router as E2 routes
 redistribute connected
!
line vty
!
